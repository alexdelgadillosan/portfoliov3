<app-navbar></app-navbar>

<section class="projects-only py-5">
  <div class="container">
    <header class="projects-only__intro mb-5">
      <h1>Projects</h1>
      <hr />
      <p class="lead projects-only__lead">
        Selected work across AI agents, distributed systems, reliability,
        developer platforms, and product builds — each with a short walkthrough
        of what it demonstrates.
      </p>
    </header>

    <article
      class="project-row"
      *ngFor="let project of projects"
      [attr.id]="project.id"
    >
      <a
        class="project-row__media"
        [href]="project.demoUrl || project.githubUrl || '#'"
        [attr.target]="project.demoUrl || project.githubUrl ? '_blank' : null"
        [attr.rel]="project.demoUrl || project.githubUrl ? 'noopener' : null"
      >
        <img
          [src]="project.image"
          [alt]="project.title"
          [style.background]="project.imageBg || '#f0f0f0'"
          [style.object-fit]="project.imageBg ? 'cover' : 'contain'"
        />
      </a>
      <div class="project-row__body">
        <h3>{{ project.title }}</h3>
        <p class="project-row__description">{{ project.description }}</p>
        <ul class="project-row__highlights" *ngIf="project.highlights?.length">
          <li *ngFor="let item of project.highlights">{{ item }}</li>
        </ul>
        <p class="project-row__tech text-muted">{{ project.tech }}</p>
        <p class="project-row__links">
          <a
            *ngIf="project.demoUrl"
            [href]="project.demoUrl"
            target="_blank"
            rel="noopener"
            >Live Demo</a
          >
          <span *ngIf="project.demoUrl && project.githubUrl"> · </span>
          <a
            *ngIf="project.githubUrl"
            [href]="project.githubUrl"
            target="_blank"
            rel="noopener"
            >GitHub</a
          >
        </p>
      </div>
    </article>
  </div>
</section>
